<!DOCTYPE html>
<html>
<head>
    <title>File Metadata Microservice</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Downloaded full SVG from Font Awesome as favicon -->
    <link rel="icon" type="image/svg+xml" href="/file-regular-full.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins&display=swap">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <h1><span id="header">File Metadata Microservice</span></h1>
    <p>Upload a file to view its metadata (name, MIME type & size)</p>
    <div class="container">
        <form enctype="multipart/form-data" method="POST" action="/api/fileanalyse">
            <input type="file" id="upfile" name="upfile" accept=".jpg,.png,.pdf" required>
            <p class="fileRestriction">* Only JPEG/PNG/PDF files are allowed.</p>
            <p class="fileRestriction">* File size must not exceed 5 MB.</p>

            <input type="submit" value="UPLOAD">
        </form>
    </div>

    <!-- Script -->
    <script src="/js/main.js"></script>

</body>
</html>
